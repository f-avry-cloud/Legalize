<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#06060e">
  <title>Legalize — Droit des affaires &amp; corporate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- ?v= : évite qu'un cache navigateur serve l'ancienne feuille de style. -->
  <link rel="stylesheet" href="style.css?v=3">
  <script>
    // Thème appliqué avant le premier rendu : évite le flash clair au chargement.
    (function () {
      try {
        // Sombre par défaut : c'est le thème principal du produit.
        document.documentElement.dataset.theme = localStorage.getItem('legalize-theme') || 'dark';
      } catch (e) { /* stockage indisponible : on garde le thème clair */ }
    }());
  </script>
</head>
<body>
  <div class="aurore" aria-hidden="true"><span></span><span></span><span></span></div>
  <a class="skip-link" href="#main">Aller au contenu</a>

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">L</span>
      <div class="brand-text">
        <strong>Legalize</strong>
        <small>Corporate</small>
      </div>
      <button class="nav-close" id="nav-close" aria-label="Fermer le menu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <nav id="nav" aria-label="Navigation principale">
      <a href="#/" data-route="dashboard">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
        <span>Tableau de bord</span>
      </a>
      <a href="#/societes" data-route="societes">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21V5a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1v16"/><path d="M15 9h4a1 1 0 0 1 1 1v11"/><path d="M8 8h3M8 12h3M8 16h3"/></svg>
        <span>Sociétés</span>
      </a>
      <a href="#/groupes" data-route="groupes">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="2.5"/><circle cx="5" cy="19" r="2.5"/><circle cx="19" cy="19" r="2.5"/><path d="M12 7.5v4M12 11.5H5v5M12 11.5h7v5"/></svg>
        <span>Groupes</span>
      </a>
      <a href="#/operations" data-route="operations">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4h9a1 1 0 0 1 1 1v15a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V6"/><path d="M9 10h6M9 14h6"/><path d="M6 4h2"/></svg>
        <span>Opérations</span>
      </a>
      <a href="#/formalites" data-route="formalites">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7a2 2 0 0 1 2-2h6l6 6v8a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2z"/><path d="M13 5v6h6"/><path d="M9 15.5l2 2 4-4"/></svg>
        <span>Formalités INPI</span>
        <em class="nav-pastille" id="nav-badge-formalites" hidden></em>
      </a>
      <a href="#/factures" data-route="factures">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>
        <span>Facturation</span>
      </a>
    </nav>

    <div class="sidebar-foot">
      <button id="theme-toggle" class="theme-toggle" aria-label="Changer de thème">
        <svg class="ico-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="ico-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        <span class="theme-label">Thème</span>
      </button>
      <small>Production documentaire &amp; formalités INPI</small>
    </div>
  </aside>

  <div class="topbar">
    <button class="nav-open" id="nav-open" aria-label="Ouvrir le menu">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <span class="brand-mark small" aria-hidden="true">L</span>
    <strong>Legalize</strong>
  </div>

  <div class="scrim" id="scrim" hidden></div>
  <main id="main" tabindex="-1"></main>
  <div id="toast" class="toast" hidden></div>

  <script src="app.js?v=3"></script>
  <script src="formalites.js?v=3"></script>
</body>
</html>
